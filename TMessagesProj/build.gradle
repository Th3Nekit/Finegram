/**
 * Python-рантайм для плагинов.
 *
 * Версия 3.11 выбрана намеренно: она последняя, у которой есть сборки под обе наши
 * архитектуры (arm64-v8a и armeabi-v7a). Путь к интерпретатору можно задать переменной
 * окружения FINEGRAM_BUILD_PYTHON — иначе берём типичные места установки.
 */
/**
 * Проверяет, что слой плагинов на Python вообще компилируется.
 *
 * Chaquopy кладёт исходники в APK как есть и синтаксическую ошибку не замечает: клиент
 * собирается, ставится и молчит, а плагины при этом не запускаются ни один. Ошибка стоит
 * одной секунды здесь и вечера поисков на устройстве.
 */
tasks.register("checkPluginRuntime") {
    group = "finegram"
    description = "Компилирует модули плагинов и падает на первой же ошибке."
    def sources = file("src/main/python")
    inputs.dir(sources)
    doLast {
        def python = ["python", "python3", "py"].find { candidate ->
            try {
                def probe = new ProcessBuilder(candidate, "--version").redirectErrorStream(true).start()
                probe.waitFor() == 0
            } catch (Exception ignored) {
                false
            }
        }
        if (python == null) {
            logger.lifecycle("Python не найден, проверка модулей плагинов пропущена")
            return
        }
        def process = new ProcessBuilder(python, "-m", "compileall", "-q", sources.absolutePath)
                .redirectErrorStream(true).start()
        def output = process.inputStream.text
        if (process.waitFor() != 0) {
            throw new GradleException("модули плагинов не компилируются:\n" + output)
        }
    }
}

tasks.matching { it.name.startsWith("generate") && it.name.contains("Python") }.configureEach {
    dependsOn("checkPluginRuntime")
}

chaquopy {
    defaultConfig {
        version = "3.11"
        def buildPythonPath = System.getenv("FINEGRAM_BUILD_PYTHON")
        if (!buildPythonPath) {
            buildPythonPath = [
                    "D:/!Python/.venv/Scripts/python.exe",
                    "/usr/bin/python3.11",
                    "/usr/local/bin/python3.11"
            ].find { file(it).exists() }
        }
        buildPython(buildPythonPath ?: "python3.11")
        pip {
            // Каталог wheels/ — необязательный склад колёс рядом с деревом. Если он есть,
            // берём только из него: chaquo.com отдаёт нативные колёса примерно по килобайту
            // в секунду, pip уходит в бесконечные повторы и спотыкается о собственный
            // недокачанный файл. Если каталога нет, всё качается обычным путём — медленно,
            // но без ручной подготовки.
            def wheelhouse = file("$projectDir/../wheels")
            if (wheelhouse.isDirectory()) {
                options "--find-links", wheelhouse.absolutePath, "--no-index"
            }
            // Тот же набор, что exteraGram кладёт в свою сборку: плагины пишутся под него и
            // без этих пакетов падают прямо на импортах.
            install "requests"
            install "certifi"
            install "urllib3"
            install "charset-normalizer"
            install "idna"
            install "beautifulsoup4"
            install "soupsieve"
            // Картинки: без Pillow падают на импорте сорок плагинов из ста трёх.
            install "Pillow"
            install "pyfiglet"
            install "aiofiles"
            install "httpx"
            install "mutagen"
            // Остаток набора exteraGram: их список вычитан из requirements в APK, чтобы не
            // гадать по одному плагину за раз.
            install "lxml"
            install "PyYAML"
            install "debugpy"
            install "packaging"
            install "typing-extensions"
            install "cffi==1.17.1"
            install "pycparser==2.22"
        }
    }
}


def getProps(String propName) {
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return ""
    }
}
// Плагин google-services здесь не применяется.
//
// Этот модуль — библиотека с namespace org.telegram.messenger, а клиент в нашем проекте
// Firebase заведён на com.th3nekit.finegram. Плагину нужен модуль-приложение: на
// библиотеке он только предупреждает и ничего не делает. Его место — в
// TMessagesProj_AppStandalone, где applicationId совпадает с описанием клиента, и
// именно оттуда в готовый APK попадают ключи, по которым FirebaseApp получает токен.

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

preBuild.dependsOn checkVisibility


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
