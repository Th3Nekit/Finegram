tasks.register("checkPluginRuntime") {
    group = "finegram"
    description = "Компилирует модули плагинов и падает на первой же ошибке."
    def sources = file("src/main/python")
    inputs.dir(sources)
    doLast {
        def python = ["python", "python3", "py"].find { candidate ->
            try {
                def probe = new ProcessBuilder(candidate, "--version").redirectErrorStream(true).start()
                probe.waitFor() == 0
            } catch (Exception ignored) {
                false
            }
        }
        if (python == null) {
            logger.lifecycle("Python не найден, проверка модулей плагинов пропущена")
            return
        }
        def process = new ProcessBuilder(python, "-m", "compileall", "-q", sources.absolutePath)
                .redirectErrorStream(true).start()
        def output = process.inputStream.text
        if (process.waitFor() != 0) {
            throw new GradleException("модули плагинов не компилируются:\n" + output)
        }
    }
}

tasks.matching { it.name.startsWith("generate") && it.name.contains("Python") }.configureEach {
    dependsOn("checkPluginRuntime")
}

