static def isMacOS() {
    def osName = System.getProperty('os.name').toLowerCase()
    return osName.contains('mac')
}

def getGitHash = { ->
    def stdout = new ByteArrayOutputStream()
    exec {
        if (isMacOS()) { // Cause git is broken on Android Studio Meerkat Feature Drop | 2024.3.2
            commandLine '/usr/bin/git', 'rev-parse', /*'--short',*/ 'HEAD'
        } else {
            commandLine 'git', 'rev-parse', /*'--short',*/ 'HEAD'
        }
        standardOutput = stdout
    }
    return stdout.toString().trim()/*.substring(0, 8)*/
}

static def getCurrentDate() {
    def formatter = DateTimeFormatter.ofPattern("dd.MM.yyyy")
    return LocalDate.now().format(formatter)
}

configurations.configureEach {
    // Плеер берём из своего модуля. CameraX просит те же пакеты из сети, и одни и те же
    // классы приезжают дважды — сборка на этом останавливается. Поэтому внешние пакеты
    // подменяем своими модулями: и версия одна, и дубля нет.
    resolutionStrategy.dependencySubstitution {
        ['container', 'muxer', 'common', 'datasource', 'decoder', 'effect', 'extractor',
         'transformer', 'exoplayer', 'ui', 'session', 'database'].each { name ->
            def target = findProject(":TMessagesProj_Modules:media3:media-lib-${name}")
            if (target != null) {
                substitute module("androidx.media3:media3-${name}") using project(target.path)
            }
        }
    }
}

