APP_VERSION_CODE_SOURCE=7175
APP_VERSION_CODE=7229
APP_VERSION_NAME=13.0.2
APP_PACKAGE=com.th3nekit.finegram
APP_VERSION_NAME_FINEGRAM=1.5.2
IS_PRIVATE=false
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Модули клиента ссылаются на ресурсы главного модуля напрямую, без своих R-классов:
# так это писалось изначально, и переучивать тысячи мест незачем.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
