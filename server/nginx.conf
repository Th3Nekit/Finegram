# tgws.th3web.com — публичный вход релея обхода.
# Релей слушает только 127.0.0.1:8096; наружу смотрит один nginx и он же держит TLS.

server {
    listen 80;
    listen [::]:80;
    server_name tgws.th3web.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tgws.th3web.com;

    ssl_certificate     /etc/letsencrypt/live/tgws.th3web.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tgws.th3web.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/tgws.access.log;
    error_log  /var/log/nginx/tgws.error.log;

    # Туннель несёт кадры MTProto: не буферизуем и держим соединение долго.
    location /apiws {
        proxy_pass http://127.0.0.1:8096;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;

        # Пропуск передаём как есть — проверяет его сам релей.
        proxy_set_header X-Cred            $http_x_cred;
        proxy_set_header X-Install         $http_x_install;

        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Всё остальное — обычная страница: домен не должен выглядеть голым.
    location / {
        root /var/www/tgws;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
